interface:
  display_name: "Финансы заёмщика"
  short_description: "Проверка компании или ИП, денежные потоки и дозапрос"
  default_prompt: "Используй $borrower-financial-analysis: поручи проверку заёмщика отдельному субагенту-аналитику. Выбери порядок по способу учёта. Для компании проверь обязательный минимум и подготовь дозапрос либо один лист PDF «Кредитный комитет». Для ИП без бухучёта зафиксируй предмет проверки, разбери доступные денежные потоки и долги, проверь классификацию и каждый вопрос по источникам, затем подготовь одностраничный PDF по согласованной форме ИП с денежной выручкой, долгом БКИ, фактическими выплатами и выводом через render_ip_dashboard.py и минимальный дозапрос в одной актуальной редакции. Текстовый разбор является рабочим материалом и не заменяет PDF."
